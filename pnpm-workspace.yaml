ignoreWorkspaceRootCheck: true
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExcludePrune: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true

packages:
  - '.'

# TODO: Migrate to named catalogs
# catalogMode: prefer
# catalogs:

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - playwright-core@1.65.0
  - '@ashtrath/skills@0.1.0'
permissions:
  drizzle-kit:
    skills: true
